name: Weekly AI Tool Ingestion Pipeline

on:
  schedule:
    # Run at 02:00 UTC every Monday
    - cron: '0 2 * * 1'
  workflow_dispatch:
    # Allow manual triggers from the GitHub UI
    inputs:
      dry_run:
        description: 'Run pipeline without inserting into database'
        required: false
        type: boolean
        default: false
      skip_apis:
        description: 'Skip API sources (Reddit, GitHub, etc)'
        required: false
        type: boolean
        default: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./scraper
        run: pip install -r requirements.txt

      - name: Run Pipeline
        working-directory: ./scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          # Build arguments based on workflow dispatch inputs (if any)
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.skip_apis }}" == "true" ]; then
            ARGS="$ARGS --skip-apis"
          fi
          
          python pipeline.py $ARGS

      - name: Upload Pipeline Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report
          path: scraper/pipeline_output/pipeline_report.json
          retention-days: 14
